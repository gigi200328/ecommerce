# ===============================
# Server Configuration
# ===============================

server.port=${SERVER_PORT:8008}

spring.application.name=ecommerce

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecom?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Yangon}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:12345}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-vi=ew=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

app.mail.from=YOUR_EMAIL@gmail.com

# ===============================
# Swagger UI Configuration
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=28800000

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
file.upload-dir=./uploads

#mmspg
payment.gateway.base-url=${GATEWAY_BASE_URL:http://localhost:8007/api/v1}
payment.gateway.client-id=YOUR_CLIENT_ID
payment.gateway.client-secret=YOUR_CLIENT_SECRET
payment.gateway.branch-id=YOUR_BRANCH_ID

payment.gateway.webhook-secret=${PAYMENT_GATEWAY_WEBHOOK_SECRET:whsec_dev_g5_callback_secret_2026}

# ===============================
# Inventory Reservation Configuration
# ===============================
storefront.inventory.reservation-ttl-minutes=3
storefront.inventory.reservation-expiry-interval-ms=60000
storefront.inventory.reservation-expiry-enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8004,http://localhost:8005,http://127.0.0.1:8004,http://127.0.0.1:8005}

# Dev profile
spring.profiles.active=dev
